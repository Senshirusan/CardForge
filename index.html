<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CardForge AI | Ultimate Studio</title>
<link rel="icon" type="image/webp" href="https://user.uploads.dev/file/23cbf9229916d9a1833fd784a65ba1fd.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --bg: #08080c; --panel: rgba(22, 22, 28, 0.72); --panel-2: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09); --arcane: #6d5ef0; --arcane-2: #8b7bf7; --ember: #f5793a; --ember-2: #fbbf24; --text: #f5f5f7; --steel: #9a9aa6; --steel-dim: #6c6c78; --off: #34343d; --on: var(--arcane); --danger: #ef4444; --danger-soft: rgba(239,68,68,0.13); --success: #22c55e; --radius-lg: 22px; --radius-md: 14px; --radius-sm: 10px; --shadow-lg: 0 24px 60px -20px rgba(0,0,0,0.55); --shadow-md: 0 12px 28px -10px rgba(0,0,0,0.45); }
  * { box-sizing: border-box; }
  body { background: var(--bg); background-image: radial-gradient(circle at 18% -10%, rgba(109,94,240,0.22) 0%, transparent 45%), radial-gradient(circle at 85% 0%, rgba(245,121,58,0.14) 0%, transparent 40%); background-attachment: fixed; color: var(--text); font-family: 'Inter', sans-serif; padding: 28px 20px 0; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  .app-shell { max-width: 1000px; width: 100%; margin: 0 auto; }
  .app-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo-mark { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, var(--arcane), var(--ember)); display: flex; align-items: center; justify-content: center; }
  .site-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.65rem; font-weight: 700; margin: 0; }
  .accent-word { background: linear-gradient(135deg, var(--arcane-2), var(--ember)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .grid { display: grid; grid-template-columns: 1fr; max-width: 1000px; margin: auto; gap: 28px; width: 100%; }
  @media (min-width: 768px) { .grid { grid-template-columns: 360px 1fr; } }
  .panel { background: var(--panel); backdrop-filter: blur(20px); padding: 26px; border-radius: var(--radius-lg); border: 1px solid var(--border); }
  input, select, textarea { width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--off); padding: 12px; border-radius: var(--radius-sm); color: white; margin-top: 5px; }
  .btn { display: block; width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; background: var(--arcane); color: white; font-weight: bold; margin-top: 15px; }
  .card-render { width: 280px; height: 392px; background: white; border-radius: 10px; border: 4px solid #cbd5e1; margin: auto; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
  .img-frame { width: 230px; height: 190px; margin-top: 54px; background: #eef1f6; border: 2px solid #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-render img { width: 100%; height: 100%; object-fit: cover; display: none; }
  #galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 26px; padding: 24px; max-width: 1000px; margin: 20px auto; border: 1.5px dashed var(--border); }
  .card-wrapper { background: rgba(255,255,255,0.03); padding: 18px; border-radius: 18px; border: 1px solid var(--border); text-align: center; }
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-header">
    <div class="brand">
      <div class="logo-mark"><svg viewBox="0 0 24 24" width="26" height="26" fill="none"><rect x="7.5" y="3" width="13" height="16" rx="2.5" fill="white"/><path d="M14 7l1.05 2.3 2.45.4-1.8 1.7.4 2.5-2.1-1.2-2.1 1.2.4-2.5-1.8-1.7 2.45-.4L14 7z" fill="#f5793a"/></svg></div>
      <div><h1 class="site-title">CardForge <span class="accent-word">AI</span></h1></div>
    </div>
  </div>
</div>

<div class="grid">
  <div class="panel">
    <label>NOM</label>
    <input type="text" id="nomInput" oninput="updateApercu()">
    <label>PROMPT (IA)</label>
    <input type="text" id="promptInput" placeholder="Ex: Guerrier épique dans une forêt">
    <button class="btn" id="genBtn" onclick="generer()">FORGER LA CARTE</button>
  </div>
  <div id="carte" class="card-render">
    <div id="displayNom" style="padding:10px; color:black; font-weight:800;">NAME</div>
    <div class="img-frame"><img id="displayImg" src=""></div>
  </div>
</div>

<div id="galerie"></div>

<script>
  // Fonction de génération Pollinations
  async function imageGenerator(prompt) {
      const seed = Math.floor(Math.random() * 1000000);
      return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&seed=${seed}&nologo=true`;
  }

  function updateApercu() {
      document.getElementById('displayNom').innerText = document.getElementById('nomInput').value || 'NAME';
  }

  async function generer() {
    const btn = document.getElementById('genBtn');
    btn.innerText = "Forge en cours...";
    btn.disabled = true;

    try {
        const prompt = document.getElementById("promptInput").value || "mystical character";
        const url = await imageGenerator(prompt);
        
        const galerie = document.getElementById('galerie');
        const div = document.createElement('div');
        div.className = 'card-wrapper';
        
        const img = document.createElement('img');
        img.src = url;
        img.style.width = "250px";
        img.style.display = "none";
        
        // Gestion de l'affichage pour éviter l'image déchirée
        img.onload = () => { img.style.display = "block"; };
        img.onerror = () => { alert("Erreur lors de la génération"); btn.innerText = "FORGER LA CARTE"; btn.disabled = false; };
        
        div.appendChild(img);
        galerie.appendChild(div);
    } catch (e) {
        alert("Erreur de connexion");
    } finally {
        btn.innerText = "FORGER LA CARTE";
        btn.disabled = false;
    }
  }
</script>
</body>
</html>
