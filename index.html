<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CardForge AI | Ultimate Studio</title>
<link rel="icon" type="image/webp" href="https://user.uploads.dev/file/23cbf9229916d9a1833fd784a65ba1fd.webp">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --bg: #08080c; --panel: rgba(22, 22, 28, 0.72); --panel-2: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09); --arcane: #6d5ef0; --arcane-2: #8b7bf7; --ember: #f5793a; --ember-2: #fbbf24; --text: #f5f5f7; --steel: #9a9aa6; --steel-dim: #6c6c78; --off: #34343d; --on: var(--arcane); --danger: #ef4444; --success: #22c55e; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 28px 20px 0; margin: 0; min-height: 100vh; }
  .grid { display: grid; grid-template-columns: 1fr; max-width: 1000px; margin: auto; gap: 28px; }
  @media (min-width: 768px) { .grid { grid-template-columns: 360px 1fr; } }
  .panel { background: var(--panel); backdrop-filter: blur(20px); padding: 26px; border-radius: 22px; border: 1px solid var(--border); }
  input, select, textarea { width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--off); padding: 12px; border-radius: 10px; color: white; margin-top: 5px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer; background: var(--arcane); color: white; font-weight: 700; margin-top: 15px; }
  .card-render { width: 280px; height: 392px; background: white; color: black; border-radius: 10px; border: 4px solid #cbd5e1; margin: auto; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; background-size: cover; background-position: center; }
  .img-frame { width: 230px; height: 190px; margin-top: 54px; border: 2px solid #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #eef1f6; }
  .card-render img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .text-box { background: rgba(255,255,255,0.95); border: 1px solid #cbd5e1; padding: 5px; font-size: 0.8rem; text-align: center; }
  #galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 26px; padding: 24px; max-width: 1000px; margin: 20px auto; border: 1.5px dashed var(--border); border-radius: 22px; }
  .card-wrapper { background: rgba(255,255,255,0.03); padding: 18px; border-radius: 18px; border: 1px solid var(--border); text-align: center; width: 320px; }
  #adv { display: none; }
  .loading { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>

<div class="grid">
  <div class="panel">
    <label>NOM</label>
    <input type="text" id="nomInput" oninput="updateApercu()">
    <label>PROMPT (IA)</label>
    <input type="text" id="promptInput">
    <button class="btn" id="genBtn" onclick="generer()">FORGER LA CARTE</button>
    <div class="btn" style="background:var(--off)" onclick="document.getElementById('adv').style.display=(document.getElementById('adv').style.display==='block'?'none':'block')">Paramètres avancés</div>
    <div id="adv">
      <label>Thème</label>
      <select id="themeSelect"><option value="Fantasy">Fantasy</option><option value="Cyberpunk">Cyberpunk</option></select>
      <button class="btn" onclick="genererFondIA()">Appliquer Habillage IA</button>
      <button class="btn" onclick="genererDos()">Forger le Dos</button>
    </div>
  </div>
  
  <div id="carte" class="card-render">
    <div id="displayNom" class="text-box" style="width:150px; margin-top:10px; font-weight:800;">NAME</div>
    <div class="img-frame"><img id="displayImg" src=""></div>
    <div id="displayLore" class="text-box" style="width:230px; margin-top:10px;">Lore...</div>
  </div>
</div>

<div id="galerie"></div>

<script>
  // API Pollinations optimisée
  async function imageGenerator(prompt) {
      const seed = Math.floor(Math.random() * 1000000);
      return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true`;
  }

  function updateApercu() {
      document.getElementById('displayNom').innerText = document.getElementById('nomInput').value || 'NAME';
  }

  async function genererFondIA() {
      const theme = document.getElementById("themeSelect").value;
      const url = await imageGenerator(`professional TCG background, themed ${theme}, high quality`);
      const card = document.getElementById('carte');
      card.style.backgroundImage = `url('${url}')`;
      card.style.backgroundSize = "cover";
  }

  async function genererDos() {
      const url = await imageGenerator("ornate symmetrical fantasy card back, white background");
      const div = document.createElement('div');
      div.className = 'card-wrapper';
      div.innerHTML = `<div class="card-render" style="background:url('${url}') center/cover"></div>`;
      document.getElementById('galerie').appendChild(div);
  }

  async function generer() {
      const btn = document.getElementById('genBtn');
      btn.innerText = "Forge en cours...";
      btn.classList.add('loading');
      
      try {
          const url = await imageGenerator(document.getElementById("promptInput").value || "magical creature");
          const galerie = document.getElementById('galerie');
          const div = document.createElement('div');
          div.className = 'card-wrapper';
          
          // Clonage de la carte actuelle pour la galerie
          div.innerHTML = document.getElementById('carte').outerHTML;
          const img = div.querySelector('img');
          img.src = url;
          img.style.display = "block";
          
          galerie.appendChild(div);
      } catch (e) {
          alert("Erreur de génération.");
      } finally {
          btn.innerText = "FORGER LA CARTE";
          btn.classList.remove('loading');
      }
  }
</script>
</body>
</html>
